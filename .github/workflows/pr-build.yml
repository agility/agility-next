name: PR build

on:
  pull_request:
    branches: [main]

jobs:
  build:
    name: Install and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      # `prepare` runs the build; fails if package-lock.json is out of sync or tsc errors.
      - run: npm ci
      - run: npm pack --dry-run
